name: Feature request
description: Suggest an improvement to the CLI or generated templates
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / developer experience
        - Expo template
        - Flutter template
        - KMP template
        - Documentation
        - Other
    validations:
      required: true
