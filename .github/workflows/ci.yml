name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Smoke test CLI
        run: |
          node dist/index.js --version
          node dist/index.js list screens --json > /dev/null
          node dist/index.js list frameworks --json > /dev/null
          node dist/index.js init --name CIApp --framework expo --dry-run --yes

      - name: Verify package contents
        run: npm pack --dry-run

  generated-projects:
    name: Verify generated ${{ matrix.framework }} project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [expo, flutter, kmp]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
        if: matrix.framework == 'flutter'

      - run: npm ci
      - run: npm run build

      - name: Generate project
        run: |
          node dist/index.js init \
            --name "CI App" \
            --framework ${{ matrix.framework }} \
            --screens signin,signup,forgot-password,profile,settings,faq,privacy-policy,terms,about,notifications,onboarding \
            --package-name com.example.ci \
            --output ./test-output/${{ matrix.framework }} \
            --no-git \
            --no-install

      - name: Verify Expo project
        if: matrix.framework == 'expo'
        working-directory: test-output/expo
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx expo prebuild --no-install --platform all

      - name: Verify Flutter project
        if: matrix.framework == 'flutter'
        working-directory: test-output/flutter
        run: |
          flutter pub get
          flutter analyze

      - name: Verify KMP project
        if: matrix.framework == 'kmp'
        working-directory: test-output/kmp
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon --console=plain
